name: Upstream Sync

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync default branch from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branch="$(gh api "repos/${repo}" --jq '.default_branch')"

          echo "Repository: ${repo}"
          echo "Default branch: ${branch}"
          echo "Starting upstream sync..."

          gh api --method POST "repos/${repo}/merge-upstream" -f branch="${branch}"

          echo "Upstream sync completed."
